<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>부풀부풀 기체 탐정단 · 생활 속 기체의 부피 변화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fdcff;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#6b5434;touch-action:manipulation;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
*{touch-action:manipulation}
canvas,#joyZone,#btnA{touch-action:none}
.card,#tdash{touch-action:pan-y}
canvas{display:block;position:fixed;inset:0}
#ov{pointer-events:none}
.hidden{display:none!important}
#clock{position:fixed;left:22px;top:16px;color:#fff;text-shadow:0 2px 0 rgba(90,70,40,.45),0 0 6px rgba(90,70,40,.25);pointer-events:none;z-index:5}
#clock .t{font-size:40px;line-height:1}
#clock .d{font-size:18px;margin-top:4px}
#clock .m{font-size:16px;margin-top:6px;background:rgba(255,251,234,.9);color:#8a6d45;display:inline-block;border-radius:999px;padding:2px 12px;text-shadow:none}
.hbtn{position:fixed;top:16px;width:46px;height:46px;border-radius:50%;background:#fff8e6;border:none;box-shadow:0 3px 0 #d9c9a3;font-family:inherit;font-size:22px;color:#8a6d45;z-index:8;cursor:pointer;display:flex;align-items:center;justify-content:center}
#menuBtn{right:18px}
#bookBtn{right:72px}
#bookBtn .dot{position:absolute;right:-2px;top:-2px;width:16px;height:16px;border-radius:50%;background:#ff5a3c;border:2px solid #fff}
#menu{position:fixed;right:18px;top:70px;background:#fff8e6;border-radius:22px;padding:10px;box-shadow:0 6px 18px rgba(80,60,30,.25);z-index:9;display:flex;flex-direction:column;gap:6px;min-width:210px}
#menu button{font-family:inherit;font-size:17px;border:none;background:#f3e6c4;color:#6b5434;border-radius:14px;padding:10px 14px;text-align:left;cursor:pointer}
#quest{position:fixed;right:130px;top:16px;width:300px;background:#fffaf0;border-radius:24px;box-shadow:0 4px 0 #e2d3ad,0 8px 18px rgba(80,60,30,.18);padding:12px 16px;z-index:6;transition:transform .25s}
#quest.pop{transform:scale(1.06)}
#quest .qh{display:flex;align-items:center;gap:8px;font-size:18px;color:#fff;background:#7cc46a;border-radius:14px;padding:4px 12px;margin:-2px -4px 8px}
#quest .qh span{margin-left:auto;font-size:15px;background:rgba(255,255,255,.3);border-radius:10px;padding:1px 8px}
#quest ul{list-style:none;margin:0;padding:0}
#quest li{display:flex;align-items:center;gap:8px;font-size:18px;padding:4px 2px}
#quest li img{width:28px;height:28px}
#quest li b{margin-left:auto;font-weight:normal;background:#f3e6c4;border-radius:10px;padding:0 8px;font-size:17px}
#quest li.done{color:#a99a7c}
#quest li.done b{background:#c7e8b8;color:#3f7a2f}
#quest li .ck{width:22px;height:22px;border-radius:7px;border:3px solid #d8c69a;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}
#quest li.done .ck{background:#7cc46a;border-color:#7cc46a}
#quest li.go{color:#e0832b}
#pocket{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,250,236,.94);padding:8px 14px;border-radius:30px;box-shadow:0 4px 0 #e2d3ad;z-index:5;min-height:66px;align-items:center}
#pocket .lab{font-size:15px;color:#a08a60;margin-right:4px}
#pocket .slot{position:relative;width:50px;height:50px;border-radius:50%;background:#f3e6c4;display:flex;align-items:center;justify-content:center}
#pocket .slot img{width:40px;height:40px}
#pocket .slot i{position:absolute;right:-4px;bottom:-4px;font-style:normal;background:#fff;border-radius:10px;font-size:14px;padding:0 6px;box-shadow:0 1px 0 #d9c9a3}
#pocket .empty{font-size:15px;color:#b6a37d;padding:0 6px}
#pocket .lab{text-align:center;line-height:1.1}#pocket .lab small{font-size:12px}
#pocket .slot[data-k]{cursor:pointer}#pocket .slot.full i{background:#ffd9cf;color:#c0523a}
#pocket .slot.empty-slot{background:transparent;border:3px dashed #e6d6a8}
#pocket .slot i{font-size:12px}
body.talking #pocket,body.talking #ctrl{opacity:0;pointer-events:none}
#dialog{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(780px,94vw);min-height:150px;background:#fffbea;border-radius:70px;padding:34px 64px 30px;box-shadow:0 6px 0 #eadcb4,0 10px 30px rgba(70,50,20,.25);z-index:20;font-size:25px;line-height:1.55;cursor:pointer;word-break:keep-all}
#dialog .tag{position:absolute;left:46px;top:-22px;padding:6px 22px;border-radius:999px;font-size:22px;color:#fff;transform:rotate(-4deg);box-shadow:0 3px 0 rgba(0,0,0,.12)}
#dialog.narr{background:rgba(40,36,30,.84);color:#f4ead2;box-shadow:none}
#dialog.narr .tag{display:none}
#dialog .nx{position:absolute;right:46px;bottom:16px;color:#f59b2b;font-size:22px;animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(5px)}}
#choices{position:fixed;right:max(4vw,calc(50% - 380px));bottom:200px;background:#fffbea;border-radius:30px;padding:12px 18px;box-shadow:0 5px 0 #eadcb4,0 10px 24px rgba(70,50,20,.22);z-index:21;display:flex;flex-direction:column;gap:2px}
#choices div{font-size:23px;padding:8px 14px 8px 38px;border-radius:16px;position:relative;cursor:pointer}
#choices div.sel{background:#fff0c4}
#choices div.sel::before{content:'▶';position:absolute;left:12px;color:#f59b2b;font-size:18px;top:12px}
.modal{position:fixed;inset:0;background:rgba(60,45,25,.38);z-index:30;display:flex;align-items:center;justify-content:center}
.card{background:#fffbea;border-radius:36px;padding:26px 30px;box-shadow:0 8px 0 #eadcb4,0 16px 40px rgba(60,40,10,.3);width:min(560px,92vw);max-height:90vh;overflow:auto;position:relative}
.btn{font-family:inherit;font-size:22px;border:none;border-radius:999px;padding:12px 34px;background:#7cc46a;color:#fff;box-shadow:0 4px 0 #5a9e4a;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5a9e4a}
.btn.or{background:#f2a046;box-shadow:0 4px 0 #c97d2a}
.btn:disabled{background:#d8d0bd;box-shadow:0 4px 0 #bdb39b;cursor:default}
.x{position:absolute;right:18px;top:16px;width:40px;height:40px;border-radius:50%;border:none;background:#f3e6c4;font-size:20px;color:#8a6d45;cursor:pointer;font-family:inherit}
#note .card{background:#fdf8e8;background-image:repeating-linear-gradient(transparent 0 37px,#e9ddbd 37px 39px);text-align:center}
.chip{display:inline-block;color:#fff;border-radius:999px;padding:4px 16px;font-size:17px}
#note h2,#book h3{margin:12px 0 6px;font-weight:normal;font-size:30px;color:#5d4630}
#note img{width:84px;height:84px;margin-top:6px}
#note p,#book p{font-size:22px;line-height:39px;margin:6px 0 18px;text-align:left;word-break:keep-all}
#note .head{font-size:18px;color:#a08a60}
#note .saved{font-size:16px;color:#7cb46a;margin-bottom:10px}
#book{z-index:80}
#book .card{width:min(720px,94vw);background:#fdf8e8}
#book h2{margin:0 0 4px;font-weight:normal;font-size:30px;color:#5d4630}
#book .sub{color:#a08a60;font-size:17px;margin-bottom:14px}
#bGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bt{background:#fff;border-radius:22px;padding:12px 8px;text-align:center;box-shadow:0 3px 0 #efe3c4;cursor:pointer;position:relative}
.bt img{width:52px;height:52px}
.bt .c{font-size:13px;color:#fff;border-radius:999px;padding:1px 10px;display:inline-block;margin:4px 0 2px}
.bt .t{font-size:19px;color:#5d4630}
.bt.lock{background:#efe7d3;cursor:default;color:#b3a487}
.bt.lock .t{color:#b3a487}
.bt .q{font-size:40px;line-height:52px;color:#cbbd98}
#bDetail{text-align:center;background-image:repeating-linear-gradient(transparent 0 37px,#e9ddbd 37px 39px)}
#bDetail img{width:84px;height:84px}
#craft h2{margin:0 0 4px;font-weight:normal;font-size:28px;color:#5d4630}
#craft .sub{color:#a08a60;font-size:17px;margin-bottom:14px}
.rc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:10px 14px;margin-bottom:10px;box-shadow:0 3px 0 #efe3c4}
.rc.need{outline:3px solid #ffc95e}
.rc img.big{width:56px;height:56px}
.rc .nm{font-size:22px;color:#5d4630}
.rc .mats{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.rc .m{display:flex;align-items:center;gap:3px;font-size:17px;background:#f3e6c4;border-radius:10px;padding:1px 8px 1px 3px}
.rc .m img{width:24px;height:24px}
.rc .m.no{background:#ffd9cf;color:#c0523a}
.rc .btn{margin-left:auto;font-size:19px;padding:9px 20px}
.rc .tagq{font-size:14px;background:#ffc95e;color:#fff;border-radius:8px;padding:0 6px;margin-left:6px}
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(rgba(140,215,255,.35),rgba(255,255,255,.05) 60%,rgba(120,200,90,.2))}
#title .logo{font-size:min(84px,13vw);color:#fff;letter-spacing:2px;text-shadow:0 5px 0 #6aa84f,3px 3px 0 #6aa84f,-3px 3px 0 #6aa84f,0 10px 20px rgba(40,90,30,.35);transform:rotate(-2deg)}
#title .logo span{color:#ffd76a}
#title .sub{margin-top:10px;font-size:min(24px,5vw);color:#5d4630;background:#fffbea;padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 #eadcb4}
#title .box{margin-top:28px;background:#fffbea;border-radius:34px;padding:22px 28px;box-shadow:0 6px 0 #eadcb4;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,90vw)}
#title label{font-size:21px}
#title input{font-family:inherit;font-size:24px;text-align:center;border:3px solid #e6d6a8;border-radius:18px;padding:8px 12px;width:100%;color:#6b5434;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
#title .hint{font-size:15px;color:#a08a60;text-align:center;line-height:1.5}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:50;transition:opacity 1s}
#caption{position:fixed;left:50%;bottom:5vh;transform:translateX(-50%);width:min(900px,92vw);text-align:center;font-size:min(30px,5.2vw);line-height:1.5;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85);z-index:45;opacity:0;transition:opacity .6s;pointer-events:none;word-break:keep-all}
#caption.now{color:#dfe3e8}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:rgba(255,251,234,.96);border-radius:999px;padding:10px 26px;font-size:20px;box-shadow:0 4px 0 #eadcb4;z-index:25;transition:opacity .4s;pointer-events:none;white-space:nowrap}
#end{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3b4048,#1d2026)}
#end .card{text-align:center;width:min(680px,94vw)}
#end h1{font-weight:normal;font-size:min(38px,7vw);margin:4px 0;color:#5d4630}
#end .k{font-size:17px;color:#a08a60}
#end .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
#end .st{background:#fff;border-radius:20px;padding:10px 4px;box-shadow:0 3px 0 #efe3c4}
#end .st img{width:46px;height:46px}
#end .st div{font-size:20px;color:#5d4630}
#end .st small{font-size:14px;color:#a08a60}
#end .sum{font-size:21px;line-height:1.6;background:#eef7e6;border-radius:20px;padding:14px 18px;color:#4c6b3a;text-align:left;word-break:keep-all}
#end .q{font-size:21px;line-height:1.6;background:#fff0c4;border-radius:20px;padding:14px 18px;margin-top:12px;text-align:left;word-break:keep-all}
#end .row{margin-top:18px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#ctrl{position:fixed;inset:0;z-index:7;pointer-events:none}
#joyZone{position:absolute;left:0;bottom:0;width:45%;height:60%;pointer-events:auto}
#joyBase{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,251,234,.45);border:4px solid rgba(255,255,255,.7);display:none}
#joyKnob{position:absolute;left:35px;top:35px;width:52px;height:52px;border-radius:50%;background:#fffbea;box-shadow:0 3px 0 #d9c9a3}
#btnA{position:absolute;right:28px;bottom:34px;width:96px;height:96px;border-radius:50%;background:#58b84a;color:#fff;font-size:44px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #3e8e33;pointer-events:auto}
#btnA:active{transform:translateY(4px);box-shadow:0 2px 0 #3e8e33}
#craft .sec{font-size:21px;color:#5d4630;margin:14px 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
#craft .sec small{font-size:15px;color:#a08a60}
#craft .none{font-size:17px;color:#b6a37d;background:#f6eedb;border-radius:16px;padding:10px 14px}
#cConfirm{text-align:center}
#cConfirm img{width:96px;height:96px}
#cConfirm .ask{font-size:27px;color:#5d4630;margin:6px 0 10px;word-break:keep-all}
#cConfirm .mats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
#cConfirm .lab{font-size:16px;color:#a08a60}
#cConfirm .warn{background:#ffe7c2;color:#b5651d;border-radius:16px;padding:10px 14px;font-size:18px;margin:6px 0 14px;word-break:keep-all}
#cConfirm .ok{background:#e4f4da;color:#4c7a3a;border-radius:16px;padding:10px 14px;font-size:18px;margin:6px 0 14px}
#cConfirm .btns{display:flex;gap:12px;justify-content:center}
.btn.gray{background:#cbbd98;box-shadow:0 4px 0 #a99a74}
#quiz{z-index:70;background:radial-gradient(circle at 50% 30%,rgba(59,64,72,.92),rgba(29,32,38,.96))}
#quiz .card{width:min(680px,94vw)}
#quiz .top{display:flex;align-items:center;gap:10px;color:#a08a60;font-size:17px;margin-bottom:6px}
#quiz .bar{flex:1;height:12px;background:#f0e6cc;border-radius:999px;overflow:hidden}
#quiz .bar i{display:block;height:100%;background:#7cc46a;border-radius:999px;transition:width .3s}
#quiz .qq{font-size:26px;color:#5d4630;line-height:1.5;margin:10px 0 16px;word-break:keep-all}
#quiz .qq b{color:#e07a3f;font-weight:normal}
#quiz .op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font-family:inherit;font-size:21px;color:#5d4630;background:#fff;border:3px solid #efe3c4;border-radius:20px;padding:12px 16px;margin-bottom:10px;cursor:pointer;word-break:keep-all;box-shadow:0 3px 0 #efe3c4}
#quiz .op span{flex:none;width:34px;height:34px;border-radius:50%;background:#f3e6c4;display:flex;align-items:center;justify-content:center;font-size:18px;color:#8a6d45}
#quiz .op.right{border-color:#7cc46a;background:#eaf7e2}#quiz .op.right span{background:#7cc46a;color:#fff}
#quiz .op.wrong{border-color:#ef8a6f;background:#ffece6}#quiz .op.wrong span{background:#ef8a6f;color:#fff}
#quiz .op:disabled{cursor:default}
#quiz .ex{border-radius:20px;padding:12px 16px;font-size:19px;line-height:1.55;margin:4px 0 14px;word-break:keep-all;text-align:left}
#quiz .ex.r{background:#eaf7e2;color:#3f6b2f}#quiz .ex.w{background:#fff0c4;color:#8a5a1d}
#quiz .res{text-align:center}
#quiz .res .big{font-size:64px;margin:6px 0}
#quiz .res .sc{font-size:34px;color:#5d4630}
#quiz .res p{font-size:20px;color:#6b5434;word-break:keep-all}
#bFoot{margin-top:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff0c4;border-radius:20px;padding:10px 14px}
#bFoot .pg{flex:1;font-size:18px;color:#8a5a1d;min-width:200px;word-break:keep-all}
.bt .rd{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#7cc46a;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center}
.bt.unread{outline:3px dashed #ffc95e}
#pass{z-index:95}
#pass .card{text-align:center;width:min(400px,92vw)}
#pass h3{font-weight:normal;font-size:23px;color:#5d4630;margin:6px 0 12px;word-break:keep-all}
#pass input{font-family:inherit;font-size:30px;letter-spacing:10px;text-align:center;border:3px solid #e6d6a8;border-radius:18px;padding:8px;width:200px;color:#6b5434;outline:none;user-select:text;-webkit-user-select:text}
#pass .err{color:#d0563a;font-size:17px;min-height:24px;margin:6px 0}
#title .tlink{position:fixed;right:18px;bottom:18px;font-family:inherit;font-size:16px;border:none;border-radius:999px;padding:9px 16px;background:rgba(255,251,234,.92);color:#8a6d45;box-shadow:0 3px 0 #d9c9a3;cursor:pointer}
body.teacher>*:not(#tdash):not(#pass){display:none!important}
#tdash{position:fixed;inset:0;overflow:auto;background:#f6eedb;background-image:radial-gradient(#efe3c4 1.5px,transparent 1.5px);background-size:22px 22px;z-index:90;padding:20px 22px 40px;color:#5d4630}
#tdash .hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
#tdash h1{font-weight:normal;font-size:30px;margin:0}
#tdash .conn{font-size:15px;border-radius:999px;padding:4px 12px;color:#fff}
#tdash .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#tdash .ctl input{font-family:inherit;font-size:18px;border:3px solid #e6d6a8;border-radius:14px;padding:6px 10px;width:130px;color:#6b5434;user-select:text;-webkit-user-select:text}
#tdash .sbtn{font-family:inherit;font-size:16px;border:none;border-radius:999px;padding:9px 16px;background:#7cc46a;color:#fff;box-shadow:0 3px 0 #5a9e4a;cursor:pointer}
#tdash .sbtn.red{background:#ef8a6f;box-shadow:0 3px 0 #c9654b}
#tdash .sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#tdash .chipS{background:#fffbea;border-radius:18px;padding:10px 16px;box-shadow:0 3px 0 #e2d3ad;font-size:17px;display:flex;align-items:center;gap:8px}
#tdash .chipS b{font-weight:normal;font-size:26px}
#tdash .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
#tdash .sc{background:#fffbea;border-radius:24px;padding:14px 16px;box-shadow:0 4px 0 #e2d3ad;position:relative}
#tdash .sc.off{opacity:.55}
#tdash .sc .nm{font-size:23px;display:flex;align-items:center;gap:8px}
#tdash .sc .st{font-size:15px;color:#fff;border-radius:999px;padding:3px 11px;display:inline-block;margin:6px 0 4px}
#tdash .sc .dt{font-size:16px;color:#7a6446;min-height:44px;line-height:1.4;word-break:keep-all}
#tdash .sc .pb{height:10px;background:#efe3c4;border-radius:999px;overflow:hidden;margin:8px 0}
#tdash .sc .pb i{display:block;height:100%;background:#7cc46a}
#tdash .sc .ft{display:flex;gap:10px;font-size:15px;color:#8a7350;flex-wrap:wrap}
#tdash .sc .dots{display:flex;gap:3px;margin-top:6px}
#tdash .sc .dots span{width:16px;height:16px;border-radius:5px;background:#e6dcc3;font-size:10px;color:#fff;display:flex;align-items:center;justify-content:center}
#tdash .sc .dots span.qo{background:#7cc46a}#tdash .sc .dots span.qx{background:#ef8a6f}
#tdash h2{font-weight:normal;font-size:22px;margin:22px 0 10px}
#tdash .qr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
#tdash .qi{background:#fffbea;border-radius:16px;padding:8px 12px;font-size:15px;box-shadow:0 2px 0 #e2d3ad}
#tdash .qi .b{height:10px;border-radius:999px;background:#efe3c4;overflow:hidden;margin-top:5px}
#tdash .qi .b i{display:block;height:100%;background:#5c9bd5}
#tdash .empty{font-size:19px;color:#a08a60;background:#fffbea;border-radius:20px;padding:24px;text-align:center}

function interactables(){const L=[];
  for(const id in VILL){const v=VILL[id];const k=CORDER.find(x=>CASES[x].npc===id);
    const lab=id==='huhu'?'말하기':k&&caseOpen(k)&&!S.solved[k]&&(S.stage==='cases'||S.stage==='bonus')?'사건 조사하기':'말하기';
    L.push({type:'npc',v,k,x:v.x,y:v.y,r:85,h:2.6,label:lab});}
  return L;}
function nearest(){let best=null,bd=1e9;interactables().forEach(o=>{const d=Math.hypot(o.x-P.x,(o.y-P.y)*1.2);if(d<o.r&&d<bd){bd=d;best=o;}});return best;}
function faceTo(x,y){P.ang=Math.atan2(x-P.x,y-P.y);}
const MODALS=['note','book','exp','quiz','pass','rep','ded'];
function busy(){return !!DLG||!!CHO||S.lock||S.trans||MODALS.some(id=>!$(id).classList.contains('hidden'));}
function onA(){
  if(S.mode==='title')return;if(!$('book').classList.contains('hidden'))return;
  if(CHO){pick(CHO.sel);return}if(DLG){dlgAdvance();return}
  if(S.mode!=='play'||busy())return;

}

async function talk(v,k){
  v.frozen=true;v.ang=Math.atan2(P.x-v.x,P.y-v.y);v.jump=T;sfx('quest');
  try{
    if(v.id==='huhu'){await talkHuhu(v);return;}
    if(k&&caseOpen(k)&&!S.solved[k]&&(S.stage==='cases'||S.stage==='bonus')){await caseFlow(k);return;}
    if(k&&!caseOpen(k)){await say(v,BUSYL[v.id]);return;}
    if(k&&S.solved[k]){await say(v,[CASES[k].after[0],'탐정 덕분에 걱정이 사라졌어!']);return;}
    await say(v,IDLE[v.id][Math.floor(Math.random()*IDLE[v.id].length)]);
  }finally{v.frozen=false;}
}

  if(S.stage==='office'){await officeFlow();return;}

function solid(x,y,r){
  if(x<60||x>1940||y<170||y>1590)return true;
  for(const id in HOUSES){const h=HOUSES[id],w=id==='fire'?92:66;if(x>h.x-w-r&&x<h.x+w+r&&y>h.y-100&&y<h.y+4+r*.4)return true;}
  if(x>POOL.x0-12-r&&x<POOL.x1+12+r&&y>POOL.y0-12-r*.5&&y<POOL.y1+12+r*.5)return true;
  const box=(cx,cy,hw,hh)=>Math.abs(x-cx)<hw+r&&Math.abs(y-cy)<hh+r*.5;
  if(box(PROP.table.x,PROP.table.y,50,30)||box(PROP.table.x+68,PROP.table.y+8,20,16))return true;
  if(box(PROP.truck.x+0,PROP.truck.y,90,36))return true;
  if(box(PROP.balloon.x,PROP.balloon.y,24,24))return true;
  if(box(PROP.smat.x,PROP.smat.y,50,38))return true;
  if(Math.hypot(x-PROP.parasol.x,y-PROP.parasol.y)<8+r)return true;
  if(Math.hypot(x-PROP.ball.x,y-PROP.ball.y)<20+r)return true;
  return false;
}

const PARTS=[];
function part(x,y,z,vx,vy,vz,col,size,life,float){PARTS.push({x,y,z,vx,vy,vz,col:hex(col),size,life,max:life,float:!!float,rot:Math.random()*6});}
let lastStep=0;
function update(dt){
  T+=dt;P.moving=false;
  if(S.mode==='play'&&!busy()){
    let mx=(KEYS.ArrowRight||KEYS.KeyD?1:0)-(KEYS.ArrowLeft||KEYS.KeyA?1:0)+JOY.x,my=(KEYS.ArrowDown||KEYS.KeyS?1:0)-(KEYS.ArrowUp||KEYS.KeyW?1:0)+JOY.y;
    const m=Math.hypot(mx,my);
    if(m>.15){mx/=Math.max(1,m);my/=Math.max(1,m);const spd=240*Math.min(1,m),nx=P.x+mx*spd*dt,ny=P.y+my*spd*dt;
      if(!solid(nx,P.y,14))P.x=nx;if(!solid(P.x,ny,14))P.y=ny;P.moving=true;P.walkT+=dt;
      const ta=Math.atan2(mx,my);let da=ta-P.ang;while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;P.ang+=da*Math.min(1,dt*14);
      if(T-lastStep>.28){lastStep=T;sfx('step');}}
  }
  for(const id in VILL){const v=VILL[id];
    if(v.frozen||S.lock&&S.stage!=='done'){v.moving=false;continue;}
    const d=Math.hypot(P.x-v.x,P.y-v.y);
    if(d<100&&S.mode==='play'){v.moving=false;v.ang=Math.atan2(P.x-v.x,P.y-v.y);continue;}
    v.wt-=dt;if(v.wt<=0){v.wt=2+Math.random()*4;const an=Math.random()*Math.PI*2,rad=Math.random()*45;v.tx=v.home.x+Math.cos(an)*rad;v.ty=v.home.y+Math.abs(Math.sin(an))*rad*.6+10;}
    const dx=v.tx-v.x,dy=v.ty-v.y,dd=Math.hypot(dx,dy);
    if(dd>4){const nx=v.x+dx/dd*55*dt,ny=v.y+dy/dd*55*dt;if(!solid(nx,ny,12)){v.x=nx;v.y=ny;v.moving=true;v.walkT+=dt;v.ang=Math.atan2(dx,dy);}else{v.tx=v.x;v.ty=v.y;v.moving=false;}}else v.moving=false;
  }
  for(let i=PARTS.length-1;i>=0;i--){const p=PARTS[i];p.life-=dt;if(p.life<=0){PARTS.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;if(p.float){p.vx*=.97;p.vz*=.97;p.vy-=2*dt;}else p.vy-=9*dt;p.rot+=dt*5;}
  if(S.mode!=='title'){cam.x=lerp(cam.x,P.x,Math.min(1,dt*5));cam.y=lerp(cam.y,P.y,Math.min(1,dt*5));}
  if(EX){EX.dt=dt;expTick(dt);}
  dlgTick(dt);bgmTick();
}

      :`<div class="empty">아직 들어온 학생이 없어요.<br>학생들이 시작 화면에서 <b>${sch}</b> / <b>${cl}</b>을(를) 똑같이 입력하면 여기에 나타나요.</div>`;
    const cs=CORDER.map(k=>{const A=L.filter(d=>d.first&&d.first[k]);const w=A.filter(d=>!d.first[k].all);const sus=A.filter(d=>!d.first[k].sus).length,vol=A.filter(d=>!d.first[k].vol).length,dir=A.filter(d=>!d.first[k].dir).length;return{k,n:A.length,w:w.length,sus,vol,dir,names:w.map(d=>d.name)};}).sort((a,b)=>(b.n?b.w/b.n:0)-(a.n?a.w/a.n:0));
    $('tdCase').innerHTML=`<table class="rk"><tr><th>사건</th><th>원인</th><th>처음에 틀린 학생</th><th>부피 변화 오답</th><th>용의자 오답</th><th>높아짐/낮아짐 오답</th><th>이름</th></tr>${cs.map(r=>{const c=CASES[r.k];const pc=r.n?Math.round(r.w/r.n*100):0;
      return `<tr><td>${c.lab==='추가'?'➕':c.lab} ${c.name}</td><td>${c.kind==='temp'?'🌡️ 온도 ':'👊 압력 '}${c.dir==='high'?'높아짐':'낮아짐'}</td><td><b>${r.n?pc+'%':'-'}</b> ${r.n?`(${r.w}/${r.n}명)`:''}</td><td>${r.vol}</td><td>${r.sus}</td><td>${r.dir}</td><td class="cb">${r.names.join(', ')}</td></tr>`;}).join('')}</table>`;
    const D=L.filter(d=>d.ded&&d.ded.pred);const PN={up:'더 커진다',same:'그대로이다',down:'조금 작아진다'},RN={tlow:'온도가 낮아져서',thigh:'온도가 높아져서',phigh:'압력이 높아져서'};
    const cntBy=(f,v)=>D.filter(d=>d.ded[f]===v).length;
    $('tdDed').innerHTML=D.length?`<div class="sum">${Object.keys(PN).map(k=>`<div class="chipS" style="${k==='down'?'color:#3f9e46':''}">${PN[k]} <b>${cntBy('pred',k)}</b></div>`).join('')}${Object.keys(RN).map(k=>`<div class="chipS" style="${k==='tlow'?'color:#3f9e46':''}">${RN[k]} <b>${cntBy('reason',k)}</b></div>`).join('')}</div>`:'<div class="empty">아직 마지막 추리를 한 학생이 없어요.</div>';
    const withAns=L.filter(d=>d.quizAns&&d.quizAns.length&&d.quizFirst!=null||d.stage==='quiz');
    $('tdQ').innerHTML=QUIZ.map((q,i)=>{const a=withAns.filter(d=>d.quizAns&&d.quizAns[i]!==undefined&&d.quizAns[i]!==null),r=a.filter(d=>d.quizAns[i]===true).length,pc=a.length?Math.round(r/a.length*100):0;const tx=q.q.replace(/<[^>]+>/g,'');
      return `<div class="qi">${i+1}. ${tx.length>40?tx.slice(0,40)+'…':tx}<div class="b"><i style="width:${pc}%"></i></div>${a.length?`정답률 ${pc}% (${r}/${a.length}명)`:'아직 푼 학생 없음'}</div>`;}).join('');
  };
  const go=async()=>{sch=$('tdSch').value.trim();cl=$('tdCls').value.trim();if(unsub){unsub();unsub=null;}DATA=[];
    if(!sch||!cl){$('tdGrid').innerHTML='<div class="empty">🏫 학교 이름과 반을 입력하고 [보기]를 눌러 주세요.<br><small>학생들이 시작 화면에 입력한 것과 똑같이 입력해야 해요. (띄어쓰기는 상관없어요)</small></div>';$('tdSum').innerHTML='';$('tdCase').innerHTML='';$('tdDed').innerHTML='';$('tdQ').innerHTML='';return;}
    cls=classKey(sch,cl);try{localStorage.setItem('gas_sch',sch);localStorage.setItem('gas_cls',cl);}catch(e){}
    unsub=await syncListen(cls,a=>{DATA=a;draw_();});};
  $('tdGo').onclick=go;$('tdBack').onclick=()=>{location.hash='';location.reload();};
  $('tdClr').onclick=async()=>{if(!sch||!cl)return;if(!await askPass(`${sch} ${cl} 반 자료를 모두 지울까요? 비밀번호를 입력하세요.`))return;await syncClear(cls);DATA=[];draw_();};
  setInterval(()=>{if(sch&&cl&&DATA.length)draw_();},5000);go();
}
$('tBtn').onclick=()=>{location.hash='teacher';location.reload();};
try{const c=localStorage.getItem('gas_cls');if(c)$('clsIn').value=c;const h=localStorage.getItem('gas_sch');if(h)$('schIn').value=h;const n=localStorage.getItem('gas_name');if(n)$('nameIn').value=n;}catch(e){}

/* ============ 시작 ============ */
function restore(d){(d.solved||[]).forEach(k=>{S.solved[k]=true;if(!S.cards.includes(k))S.cards.push(k);});S.first=d.first||{};S.bonusOpen=!!d.bonusOpen;S.rep=d.rep||null;S.ded=d.ded||null;
  S.quizBest=d.quizBest||0;S.quizLast=d.quizLast==null?null:d.quizLast;S.quizFirst=d.quizFirst==null?null:d.quizFirst;S.quizAns=d.quizAns||[];S.started=d.started||Date.now();
  const st=d.stage;S.stage=['report','deduce','quiz'].includes(st)?'office':st==='tutorial'?'cases':st||'cases';if(S.stage==='cases'&&S.bonusOpen)S.stage='bonus';}
async function startGame(){
  if(S.mode!=='title')return;
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  const sch=$('schIn').value.trim(),cl=$('clsIn').value.trim(),nm=$('nameIn').value.trim();
  if(!nm){toast('🕵️ 탐정 이름을 입력해 주세요!',2400);$('nameIn').focus();return;}
  if(!sch||!cl){toast('🏫 학교 이름과 반을 모두 입력해 주세요!',2600);($('schIn').value.trim()?$('clsIn'):$('schIn')).focus();return;}
  S.name=nm;S.school=sch;S.clsName=cl;S.cls=classKey(sch,cl);S.sid=sidOf(nm);try{localStorage.setItem('gas_sch',sch);localStorage.setItem('gas_cls',cl);localStorage.setItem('gas_name',nm);}catch(e){}
  $('startBtn').disabled=true;$('startBtn').textContent='불러오는 중…';
  const old=await syncGet(S.cls,S.sid);
  $('title').classList.add('hidden');S.mode='play';P.x=1000;P.y=760;P.ang=Math.PI;cam.x=P.x;cam.y=P.y;
  ['menuBtn','bookBtn'].forEach(id=>$(id).classList.remove('hidden'));updateBookBtn();
  if(isTouch())$('ctrl').classList.remove('hidden');
  BGM.mode='happy';bgmStart();
  if(old&&old.solved&&(old.solved.length||old.stage!=='tutorial')){S.lock=true;
    await say(VILL.huhu,[`어서 와, {name}! 지난번에 사건 ${old.solved.length}개를 해결했었지?`],true);const i=await choose(['▶ 이어서 할게요','🔄 처음부터 할게요']);S.lock=false;
    if(i===0){restore(old);S.stage=S.stage==='done'?'done':S.stage;updateQuestUI();updateHUD();report(true);setInterval(()=>report(true),60000);if(S.stage==='done')toast('🏅 이미 정식 탐정이에요! 마을을 자유롭게 둘러봐요.',3500);return;}}
  S.stage='tutorial';S.started=Date.now();updateHUD();report(true);setInterval(()=>report(true),60000);
  await wait(400);await tutorial();
}
async function tutorial(){const v=VILL.huhu;S.lock=true;v.frozen=true;v.ang=0;
  await say(NARR,['여기는 바닷가 옆 작은 마을, «몽글 마을».','요즘 마을 고민 상담 게시판에 이상한 제보가 쌓이고 있어요.']);
  await say(v,['후후, 네가 이번에 새로 들어온 신입 탐정 {name}이구나! 나는 탐정단 반장 «후후»야.','요즘 마을이 시끌시끌해. "누가 내 비치 볼에 몰래 바람을 넣었어!", "냉장고 유령이 랩을 눌렀어!" 하고 말이야.','내가 조사해 보니 모든 사건의 범인은 물건 안에 든 «공기(기체)»야.','그런데 공기 혼자서는 못 해. 공기의 «부피»를 몰래 바꾸는 «두 용의자»가 있지!']);
  await showNote(Object.assign({head:'📒 탐정 수첩 · 용의자 카드를 받았어요'},SUSP.temp));
  await showNote(Object.assign({head:'📒 탐정 수첩 · 용의자 카드를 받았어요'},SUSP.press));
  await say(v,['사건 현장에 가면 직접 해 보면서 «온도계»와 «누르는 힘» 게이지, «알갱이 돋보기»를 잘 살펴봐.','그리고 범인이 어느 용의자인지, 그 용의자가 «높아졌는지 낮아졌는지» 밝혀내는 거야!','느낌표(!)가 뜬 주민 4명이 사건을 맡기려고 기다리고 있어. 순서는 마음대로 해도 돼.','📒 탐정 수첩은 오른쪽 위에 있어. 그럼 출동!']);
  v.frozen=false;S.lock=false;S.stage='cases';updateQuestUI();report(true);toast('🔎 느낌표(!)가 뜬 주민을 찾아가요 · 이동: 방향키 / 왼쪽 화면 끌기',4200);
}
$('startBtn').onclick=startGame;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render(dt);requestAnimationFrame(loop);}
if(location.hash==='#teacher'){teacherMode();}
else if(gl){initGL();buildDyn();(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,wait(1500)]):Promise.resolve()).then(()=>requestAnimationFrame(loop));}

</script>
